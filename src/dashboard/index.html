<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoGrid Analytics - Acceso Corporativo</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --card-bg: #1e293b;
            --accent: #10b981;
            --accent-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .auth-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .brand-header h1 {
            margin: 0;
            font-size: 1.75rem;
            color: var(--accent);
        }

        .brand-header p {
            margin: 0.5rem 0 0;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .tab-buttons {
            display: flex;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 0.75rem;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .submit-btn {
            width: 100%;
            padding: 0.85rem;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: var(--accent-hover);
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="brand-header">
            <h1>EcoGrid Analytics</h1>
            <p>Plataforma Inteligente de Previsión Energética</p>
        </div>

        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('login')">Iniciar Sesión</button>
            <button class="tab-btn" onclick="switchTab('register')">Registrar Empresa</button>
        </div>

        <!-- FORMULARIO DE INICIO DE SESIÓN -->
        <form id="loginForm" class="form-section active" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="loginEmail">Correo Electrónico Corporativo</label>
                <input type="email" id="loginEmail" placeholder="usuario@empresa.com" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Contraseña</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="submit-btn">Acceder al Dashboard</button>
        </form>

        <!-- FORMULARIO DE REGISTRO MAPEADO A TABLA USUARIOS (Oracle) -->
        <form id="registerForm" class="form-section" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="regCIF">CIF Corporativo (Empresa)</label>
                <input type="text" id="regCIF" placeholder="" pattern="^[A-Za-z0-9]{9}$" title="Introduzca un CIF válido de 9 caracteres" required>
            </div>
            <div class="form-group">
                <label for="regNombre">Nombre Completo (Administrador)</label>
                <input type="text" id="regNombre" placeholder="" required>
            </div>
            <div class="form-group">
                <label for="regEmail">Correo Electrónico Corporativo</label>
                <input type="email" id="regEmail" placeholder="" required>
            </div>
            <div class="form-group">
                <label for="regPassword">Contraseña</label>
                <input type="password" id="regPassword" placeholder="Mínimo 8 caracteres" minlength="8" required>
            </div>
            <button type="submit" class="submit-btn">Crear Cuenta Corporativa</button>
        </form>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(form => form.classList.remove('active'));

            if (tab === 'login') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            // Simulación de autenticación exitosa (redirección a la vista del dashboard)
            window.location.href = 'dashboard.html';
        }

        function handleRegister(e) {
            e.preventDefault();
            const userData = {
                cif: document.getElementById('regCIF').value,
                nombre: document.getElementById('regNombre').value,
                email: document.getElementById('regEmail').value,
                // El primer registro asigna automáticamente idRol: 1 (Administrador Corporativo)
                idRol: 1,
                activo: true
            };
            
            alert('Registro corporativo iniciado correctamente para la empresa con CIF: ' + userData.cif);
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
