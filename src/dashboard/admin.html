<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoGrid Analytics - Panel de Administración</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --card-bg: #1e293b;
            --accent: #10b981;
            --accent-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --info-bg: #0f172a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
        }

        .admin-container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent);
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 1.5rem;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .role-description {
            background-color: var(--info-bg);
            border-left: 3px solid var(--accent);
            padding: 0.75rem 1rem;
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-radius: 0 6px 6px 0;
        }

        .submit-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.85rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <header>
            <h1>Gestión Corporativa (Administrador)</h1>
            <div class="nav-links">
                <a href="dashboard.html">Ir al Dashboard</a>
                <a href="index.html">Cerrar Sesión</a>
            </div>
        </header>

        <div class="card">
            <h2>Dar de Alta a Nuevo Trabajador</h2>
            <form id="createUserForm" onsubmit="handleCreateUser(event)">
                <div class="form-group">
                    <label for="workerName">Nombre Completo</label>
                    <input type="text" id="workerName" required>
                </div>

                <div class="form-group">
                    <label for="workerEmail">Correo Electrónico Corporativo</label>
                    <input type="email" id="workerEmail" required>
                </div>

                <div class="form-group">
                    <label for="workerPassword">Contraseña Temporal</label>
                    <input type="password" id="workerPassword" minlength="8" required>
                </div>

                <div class="form-group">
                    <label for="workerRole">Rol y Permisos del Sistema</label>
                    <select id="workerRole" onchange="updateRoleDescription()" required>
                        <option value="" selected>Selecciona un rol corporativo...</option>
                        <option value="trader">Gestor de Compra de Energía (Trader)</option>
                        <option value="operator">Operador de Red y Monitorización</option>
                        <option value="auditor">Auditor / Responsable Financiero</option>
                    </select>
                    <div id="roleDescBox" class="role-description">
                        Selecciona un rol para ver el detalle de los accesos asociados en la plataforma.
                    </div>
                </div>

                <button type="submit" class="submit-btn">Registrar Usuario en la Empresa</button>
            </form>
        </div>
    </div>

    <script>
    const descriptions = {
        trader: [
            "Acceso a la curva de demanda predicha a 24h",
            "Precios marginales OMIE",
            "Herramientas de ajuste para la mesa de contratación"
        ],
        operator: [
            "Supervisión de curvas horarias",
            "Filtros territoriales por CCAA",
            "Gestión de alertas tempranas"
        ],
        auditor: [
            "Acceso al histórico de desviaciones",
            "Cálculo de sobrecostes estimados en euros (€)",
            "Generación de informes de auditoría"
        ]
    };

    function updateRoleDescription() {
        const select = document.getElementById('workerRole');
        const descBox = document.getElementById('roleDescBox');
        const selectedVal = select.value;

        if (!selectedVal || !descriptions[selectedVal]) {
            descBox.textContent = "Selecciona un rol para ver el detalle de los accesos asociados en la plataforma.";
            return;
        }

        // Generar la lista con viñetas dinámicamente
        const items = descriptions[selectedVal];
        let htmlList = '<ul style="margin: 0; padding-left: 20px; line-height: 1.5;">';
        items.forEach(item => {
            htmlList += `<li>${item}</li>`;
        });
        htmlList += '</ul>';

        descBox.innerHTML = htmlList;
    }

    function handleCreateUser(e) {
        e.preventDefault();
        const name = document.getElementById('workerName').value;
        const email = document.getElementById('workerEmail').value;

        alert(`Trabajador ${name} (${email}) registrado con éxito con el rol asignado.`);
        document.getElementById('createUserForm').reset();
        document.getElementById('roleDescBox').textContent = "Selecciona un rol para ver el detalle de los accesos asociados en la plataforma.";
    }
</script>
</body>
</html>
