<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoGrid Analytics - Panel de Administración</title>
    <!-- Lucide para iconos vectoriales limpios -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-primary: #0f172a;
            --card-bg: #1e293b;
            --accent: #10b981;
            --accent-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --info-bg: #0f172a;
            --danger: #ef4444;
            --info: #3b82f6;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
        }

        .admin-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 1.5rem;
            font-size: 0.9rem;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 2rem;
        }

        .card-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .card h2 {
            margin: 0;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-muted);
            background-color: rgba(15, 23, 42, 0.4);
            font-weight: 600;
        }

        tr:hover {
            background-color: rgba(51, 65, 85, 0.2);
        }

        .badge-role {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: help;
        }

        .role-admin { background-color: rgba(239, 68, 68, 0.15); color: var(--danger); }
        .role-analyst { background-color: rgba(59, 130, 246, 0.15); color: var(--info); }
        .role-operator { background-color: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .role-manager { background-color: rgba(16, 185, 129, 0.15); color: var(--accent); }

        /* Contenedor de errores visible */
        #adminErrorContainer {
            display: none;
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        .admin-note {
            color: var(--text-muted);
            margin-top: 0;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <!-- Contenedor visible para errores -->
        <div id="adminErrorContainer"></div>

        <header>
            <h1>
                <i data-lucide="shield-check" style="width: 24px; height: 24px;"></i>
                Gestión Corporativa - EcoGrid Power Trading S.L.
            </h1>
            <div class="nav-links">
                <a href="dashboard.html"><i data-lucide="layout-dashboard" style="width: 16px; height: 16px;"></i> Ir al Dashboard</a>
                <a href="index.html" id="logoutLink"><i data-lucide="log-out" style="width: 16px; height: 16px;"></i> Cerrar Sesión</a>
            </div>
        </header>

        <!-- TARJETA PRINCIPAL: DIRECTORIO DE USUARIOS -->
        <div class="card">
            <div class="card-header-flex">
                <h2><i data-lucide="users" style="width: 20px; height: 20px;"></i> Directorio de Personal Registrado</h2>
            </div>

            <p class="admin-note">Directorio de solo lectura. El administrador se crea directamente en la base de datos.</p>

            <!-- TABLA DE REGISTROS -->
            <div class="table-responsive" style="margin-top: 1rem;">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre / Correo</th>
                            <th>CIF Vinculado</th>
                            <th>Rol Asignado</th>
                            <th>Fecha de Alta</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <!-- Se poblará dinámicamente mediante admin-api.js -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- PUNTO DE ENTRADA MODULAR PARA LA ADMINISTRACIÓN -->
    <script type="module" src="./admin-api.js"></script>
</body>
</html>
